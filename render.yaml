databases:
  - name: fm-support-db
    plan: free
    databaseName: fm_support
    user: fm_support

services:
  - type: web
    name: fm-support-backend
    runtime: node
    plan: free
    # TEMPORARY: the "&& npx ts-node --transpile-only prisma/seed-pilot.ts"
    # step below seeds the "FM" / "1111" pilot org (Evergreen Garments) into
    # production, since `prisma migrate deploy` never seeds data and no prior
    # deploy has run this. It's idempotent (upsert-based), but remove this
    # line again once the seed has run once against prod — no need to re-run
    # it on every future deploy.
    buildCommand: >-
      npm install &&
      npx prisma generate &&
      npx prisma migrate deploy &&
      npx ts-node --transpile-only prisma/seed-pilot.ts &&
      npm install --prefix fm-support-frontend &&
      npm run build --prefix fm-support-frontend
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: fm-support-db
          property: connectionString
      # AI is switched off for now — ticket suggestions already use canned
      # responses, and the portal search bar falls back to local keyword
      # routing (see src/services/openai.ts). Add OPENAI_API_KEY here and
      # flip this to "false" once a real/trained model is ready.
      - key: OPENAI_DEMO_MODE
        value: "true"
      - key: PORT
        value: "4000"
      # Web Push (mobile/desktop notifications). Generate with:
      #   npx web-push generate-vapid-keys
      # and paste the values into the Render dashboard — without these, push
      # is silently disabled (in-app notifications still work fine).
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        value: "mailto:support@fmcorporation.com"
