services:
  - type: web
    name: fm-support-backend
    runtime: node
    plan: free
    # TEMPORARY: the "&& npx ts-node --transpile-only prisma/seed-pilot.ts"
    # step below seeds the "FM" / "1111" pilot org (Evergreen Garments) into
    # production, since `prisma migrate deploy` never seeds data and no prior
    # deploy has run this. It's idempotent (upsert-based), but remove this
    # line again once the seed has run once against prod — no need to re-run
    # it on every future deploy.
    buildCommand: >-
      npm install &&
      npx prisma generate &&
      npx prisma migrate deploy &&
      npx ts-node --transpile-only prisma/seed-pilot.ts &&
      npm install --prefix fm-support-frontend &&
      npm run build --prefix fm-support-frontend
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      # Render's own free-tier Postgres databases get deleted 30 days after
      # creation, which is what broke this the first time — moved to Neon
      # (or any other host with a non-expiring free tier) instead. Set the
      # actual connection string in the Render dashboard, not here.
      - key: DATABASE_URL
        sync: false
      # Claude (Anthropic) powers ticket diagnosis + portal search, on top of
      # the local machine-manual knowledge base (see src/services/claude.ts).
      # Set the actual key in the Render dashboard, not here — it's a secret.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CLAUDE_DEMO_MODE
        value: "false"
      - key: CLAUDE_MAX_MONTHLY_USD
        value: "20.00"
      - key: PORT
        value: "4000"
      # Web Push (mobile/desktop notifications). Generate with:
      #   npx web-push generate-vapid-keys
      # and paste the values into the Render dashboard — without these, push
      # is silently disabled (in-app notifications still work fine).
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        value: "mailto:support@fmcorporation.com"
